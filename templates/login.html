<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Revive los recuerdos de un día tan especial.">
  <meta property="og:description" content="Revive los recuerdos de un día tan especial.">
  <title>Acceso a las fotos · Ana y Miguel</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0e3ce;color:#003366;font-family:Arial,sans-serif}main{width:min(100%,440px);padding:36px 28px;border:1px solid #d6c7ad;border-radius:6px;background:#fffdf9}h1{font-family:Georgia,serif;line-height:1.2}p{line-height:1.6;color:#415c72}label{display:block;margin:24px 0 8px;font-weight:700}input{width:100%;padding:14px;border:1px solid #9daeb7;border-radius:4px;font:inherit}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:4px;background:#003366;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.error{color:#a63424}
  </style>
</head>
<body><main>
  <h1>Las fotos de Ana y Miguel</h1>
  <p>Introduce la contraseña que te hemos compartido para ver las fotos de nuestra boda.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('guest_login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
</main></body>
</html>
