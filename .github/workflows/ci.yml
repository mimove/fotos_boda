name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            evaluation/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-bin
          command -v jsc
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r evaluation/requirements.txt
      - name: Download verified face models
        run: python download_models.py
      - name: Run tests
        env:
          EVAL_YUNET_MODEL: ${{ github.workspace }}/models/face_detection_yunet_2023mar.onnx
          EVAL_SFACE_MODEL: ${{ github.workspace }}/models/face_recognition_sface_2021dec.onnx
        run: python -m pytest -q -rs tests

  image:
    name: Docker image (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Build production image
        run: docker build --tag wedding-ci .
      - name: Verify application and face recognition imports
        run: >-
          docker run --rm
          --env DATA_DIR=/tmp/wedding-ci
          --env PHOTO_ROOT=/tmp
          --entrypoint python
          wedding-ci
          -c "import app; from face_engine import _models; _models(); print('Python and face recognition models OK')"
