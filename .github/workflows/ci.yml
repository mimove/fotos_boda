name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            evaluation/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libopenblas-dev liblapack-dev libjavascriptcoregtk-bin
          command -v jsc
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r evaluation/requirements.txt
      - name: Run tests
        run: python -m pytest -q -rs tests
